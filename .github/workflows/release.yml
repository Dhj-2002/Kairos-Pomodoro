name: Kairos-Pomodoro Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# tauri-action creates the GitHub release and uploads assets, which requires
# write access to repo contents. The default GITHUB_TOKEN is read-only in repos
# with restricted default permissions — without this, release creation fails
# with "Resource not accessible by integration".
permissions:
  contents: write

# Prevent concurrent release builds from racing on the same tag and clobbering
# each other's release assets / latest.json manifest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify tag, version, and publishable file set
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          }
          if git ls-files | grep -E '(^|/)(kairos-backup-.*\.json|Kairos-calendar-sync.*\.json|.*\.(db|db-shm|db-wal|dmg|zip|key))$'; then
            echo "::error::A private or generated artifact is tracked by Git"
            exit 1
          fi

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck and test
        run: |
          bunx --bun tsc --noEmit
          bun --bun run test

  publish-tauri:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            updater-platform: darwin-aarch64
          # The user's Hackintosh is Intel.  Keep this as a native Intel job
          # instead of cross-compiling on the Apple Silicon runner so the
          # resulting updater bundle is validated on the matching architecture.
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            updater-platform: darwin-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            updater-platform: windows-x86_64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            updater-platform: linux-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      # An updater artifact without the matching private key cannot be accepted
      # by installed clients. Fail before the expensive native build rather than
      # publishing a release that appears valid but cannot update itself.
      - name: Verify updater signing secrets
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured."
            exit 1
          fi

      # tauri-action builds, signs with TAURI_SIGNING_PRIVATE_KEY, generates the
      # updater manifest (latest.json with a `platforms` map), and uploads all
      # artifacts to the GitHub release identified by tagName. Replaces the old
      # manual `tauri build` + ad-hoc macOS codesign/repack + broken upload
      # globs that never produced a manifest (root cause of the dead updater).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kairos-Pomodoro ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          # NSIS is the Windows updater bundle format (the app bundles nsis,
          # not msi). updaterJsonPreferNsis makes the manifest key the nsis URL.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Guard: fail loudly if the updater manifest was not generated, so a
      # silent regression (the exact bug that shipped v1.2.0 with no manifest)
      # can never pass CI again. tauri-action writes latest.json to the runner
      # CWD and uploads it to the release; we assert it exists locally.
      - name: Verify updater manifest exists
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f "latest.json" ]; then
            echo "::error::latest.json updater manifest was not generated — updater will be dead."
            echo "Build artifacts present:"
            find src-tauri/target/release/bundle -maxdepth 3 -type f 2>/dev/null | head -40
            exit 1
          fi
          echo "::notice::Updater manifest present"
          echo "=== latest.json ==="
          cat latest.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("latest.json","utf8")).platforms||{}; const expected=process.argv[1]; if (!p[expected]) { console.error(`::error::latest.json is missing ${expected}`); process.exit(1); } console.log(`::notice::latest.json contains ${expected}`);' "${{ matrix.updater-platform }}"

      # Preserve each runner's manifest under a unique artifact name. Matrix
      # jobs must never be trusted to publish the final latest.json because
      # tauri-action uploads the same asset name from every platform and the
      # last writer would erase all previously published platform entries.
      - name: Upload platform updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-${{ matrix.updater-platform }}
          path: latest.json
          if-no-files-found: error

  publish-updater-manifest:
    name: Merge and publish complete updater manifest
    needs: publish-tauri
    runs-on: ubuntu-22.04
    steps:
      - name: Download every platform manifest
        uses: actions/download-artifact@v4
        with:
          pattern: updater-manifest-*
          path: platform-manifests

      - name: Merge and verify updater platforms
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'platform-manifests';
          const files = [];
          const visit = (dir) => {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) visit(full);
              else if (entry.name === 'latest.json') files.push(full);
            }
          };
          visit(root);
          if (files.length !== 4) throw new Error(`Expected 4 platform manifests, found ${files.length}`);
          const manifests = files.map((file) => JSON.parse(fs.readFileSync(file, 'utf8')));
          const versions = new Set(manifests.map((item) => item.version));
          if (versions.size !== 1) throw new Error(`Manifest version mismatch: ${[...versions].join(', ')}`);
          const merged = { ...manifests[0], platforms: {} };
          for (const manifest of manifests) Object.assign(merged.platforms, manifest.platforms || {});
          const required = ['darwin-x86_64', 'darwin-aarch64', 'windows-x86_64', 'linux-x86_64'];
          const missing = required.filter((key) => !merged.platforms[key]);
          if (missing.length) throw new Error(`Merged latest.json missing: ${missing.join(', ')}`);
          fs.writeFileSync('latest.json', `${JSON.stringify(merged, null, 2)}\n`);
          console.log(`Merged ${files.length} manifests with keys: ${Object.keys(merged.platforms).join(', ')}`);
          NODE

      - name: Replace race-prone manifest with merged manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Verify published Intel Mac updater entry
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/latest.json"
          curl -fsSL "$url" -o published-latest.json
          node -e 'const p=require("./published-latest.json").platforms||{}; for (const key of ["darwin-x86_64","darwin-aarch64","windows-x86_64","linux-x86_64"]) if (!p[key]) throw new Error(`Published latest.json missing ${key}`); console.log("Published latest.json contains every required updater platform")'
